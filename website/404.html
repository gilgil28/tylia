<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Tylia</title>
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="page-fill">
    <svg width="0" height="0" class="visually-hidden" aria-hidden="true" focusable="false">
      <symbol id="i-logo" viewBox="256 208 512 640">
        <path class="lane-2" d="M364 272 V372 C364 470 540 468 540 566" />
        <path
          class="lane-1"
          d="M664 272 V420 C664 520 540 500 540 600 V640 C540 730 420 720 420 790"
        />
        <circle class="lane-2" cx="364" cy="272" r="62" />
        <circle class="lane-1" cx="664" cy="272" r="62" />
        <circle class="lane-1" cx="420" cy="790" r="62" />
      </symbol>
    </svg>

    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="/" aria-label="Tylia home">
          <svg class="logo" aria-hidden="true" focusable="false"><use href="#i-logo" /></svg>
          <span>Tylia</span>
        </a>
      </div>
    </header>

    <main id="main">
      <section class="not-found hero" aria-labelledby="nf-title">
        <div class="wrap">
          <svg class="logo hero-mark" aria-hidden="true" focusable="false">
            <use href="#i-logo" />
          </svg>
          <h1 id="nf-title">Page not found</h1>
          <p>There is nothing at this address. The page may have moved.</p>
          <a class="btn btn-primary" href="/">Go to the home page</a>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <span>Tylia</span>
        <ul class="footer-links" aria-label="Project">
          <li><a href="https://github.com/gilgil28/tylia">GitHub</a></li>
          <li><a href="https://github.com/gilgil28/tylia#license">MIT or Apache-2.0</a></li>
          <li><a href="https://github.com/gilgil28/tylia#privacy">No telemetry</a></li>
        </ul>
      </div>
    </footer>
  </body>
</html>
