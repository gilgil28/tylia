[workspace]
resolver = "3"
members = ["crates/tylia-git", "src-tauri"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gilgil28/tylia"
homepage = "https://gilgil28.github.io/tylia/"
authors = ["The Tylia contributors"]

[workspace.dependencies]
tylia-git = { path = "crates/tylia-git" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", default-features = false }
ts-rs = "=12.0.1"
tempfile = "=3.27.0"
base64 = "=0.23.1"
notify = "=8.2.0"
notify-debouncer-full = "=0.7.0"
trash = "=5.2.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Line tables are enough for panics and backtraces; full debug info made target/ several GB larger.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
strip = true

# A release-like build to try a change locally (CONTRIBUTING.md → "Review builds"): no LTO,
# parallel and incremental code generation, so a one-line change rebuilds in a quarter of
# the time. Releases keep the profile above.
[profile.review]
inherits = "release"
codegen-units = 16
incremental = true
lto = false
