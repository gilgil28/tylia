name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check [the roadmap](https://github.com/gilgil28/tylia/blob/main/docs/ROADMAP.md) first; the feature may already be planned for a later phase.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Mention keyboard shortcuts or where it would live in the UI if you have an idea.
    validations:
      required: true
  - type: textarea
    id: git-equivalent
    attributes:
      label: Git command equivalent
      description: The `git` commands this corresponds to, if any.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
