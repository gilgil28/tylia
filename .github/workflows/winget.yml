name: winget

# When a release is published, opens the pull request that adds it to winget-pkgs
# (microsoft/winget-pkgs), from the fork of the account that owns WINGET_TOKEN. Needs the
# repository variable WINGET_ENABLED=true and the secret WINGET_TOKEN (a classic token with
# public_repo), and Tylia.Tylia already in winget-pkgs (the first version goes in by hand from
# packaging/winget). See docs/RELEASING.md.

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to submit, e.g. 0.3.0"
        required: true

permissions:
  contents: read

jobs:
  submit:
    name: Submit to winget-pkgs
    if: vars.WINGET_ENABLED == 'true'
    runs-on: windows-latest
    steps:
      # wingetcreate (MIT) at a pinned release, checked against its published SHA-256.
      - name: Download wingetcreate
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe -OutFile wingetcreate.exe
          $hash = (Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash
          if ($hash -ne "24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA") {
            throw "wingetcreate.exe has an unexpected SHA-256: $hash"
          }

      - name: Open the pull request
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          $version = $env:VERSION.TrimStart("v")
          $url = "https://github.com/gilgil28/tylia/releases/download/v$version/Tylia_${version}_x64-setup.exe"
          .\wingetcreate.exe update Tylia.Tylia --version $version --urls $url --submit --token $env:WINGET_TOKEN
