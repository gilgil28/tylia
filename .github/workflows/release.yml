name: Release

# Pushing a tag `vX.Y.Z` builds the installers on all three OSes and attaches them to a
# draft GitHub release (notes from CHANGELOG.md). Review the draft and publish it by hand;
# publishing starts the Pages workflow, which points the website's download links at it.
# See docs/RELEASING.md.

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # The build jobs put these notes in latest.json, which the update dialog shows.
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check the tag matches the app version
        run: |
          version="$(node -p 'require("./package.json").version')"
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ] || [ "$version" != "$cargo_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, package.json $version and Cargo.toml $cargo_version must agree."
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section between "## [version]" and the next "## [".
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi
          cat notes.md
          {
            echo "notes<<EOF_RELEASE_NOTES"
            cat notes.md
            echo "EOF_RELEASE_NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists; the build jobs will update its assets."
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "Tylia ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04 # oldest supported glibc, so the AppImage runs on more distros
            args: ""
          - name: Windows x64
            os: windows-latest
            args: ""
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: release

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater bundles (minisign); the public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          # latest.json lists the NSIS installer for Windows updates.
          updaterJsonPreferNsis: true
          # tauri-action writes this into latest.json as the notes (the release itself
          # already has them from the draft job).
          releaseBody: ${{ needs.draft.outputs.notes }}
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.args }}
