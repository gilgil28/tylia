[package]
name = "tylia"
description = "Tylia, a calm, fast desktop Git client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
default-run = "tylia"

[lib]
# Distinct from the binary name to avoid a filename clash on Windows.
name = "tylia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tylia-git.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
tokio.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
# Opt-in update check and install (signed bundles from GitHub Releases).
tauri-plugin-updater = "=2.14.0"
# OS randomness for the askpass session token.
getrandom = "=0.4.3"
# One window: a second launch hands its arguments to the running app.
tauri-plugin-single-instance = "=2.5.4"
# Hosting accounts: the GitHub / GitLab / Bitbucket APIs (both already built for the updater).
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
